services:
  - type: web
    name: medauth-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt reportlab && python datasets/generate_sample_pdfs.py"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_FLASH_MODEL
        value: gemini-3.8-flash
